
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculadora">
        <h1>Calculadora</h1>
        <p class="descricao">Insira os números e escolha uma operação.</p>

        <div class="campo">
            <label for="numero1">Primeiro número</label>
            <input
                type="number"
                id="numero1"
                placeholder="Digite o primeiro número"
                step="any"
            >
        </div>

        <div class="campo">
            <label for="numero2">Segundo número</label>
            <input
                type="number"
                id="numero2"
                placeholder="Digite o segundo número"
                step="any"
            >
        </div>

        <div class="campo">
            <label for="operacao">Operação matemática</label>
            <select id="operacao">
                <option value="">Selecione uma operação</option>
                <option value="soma">Soma (+)</option>
                <option value="subtracao">Subtração (-)</option>
                <option value="multiplicacao">Multiplicação (×)</option>
                <option value="divisao">Divisão (÷)</option>
                <option value="potenciacao">Potenciação (xʸ)</option>
                <option value="radiciacao">Radiciação (ⁿ√x)</option>
            </select>
        </div>

        <div class="botoes">
            <button id="calcular">Calcular</button>
            <button id="limpar" class="botao-limpar">Limpar</button>
        </div>

        <div class="resultado">
            <h2>Resultado:</h2>
            <p id="resultado">Aguardando operação...</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
